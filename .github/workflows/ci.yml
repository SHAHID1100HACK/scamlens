name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt feedparser beautifulsoup4 pyyaml
      - run: python scripts/train_classifier.py
      - run: python scripts/package_extension.py
      - run: pytest -q
      - run: pip-audit -r requirements.txt || true
